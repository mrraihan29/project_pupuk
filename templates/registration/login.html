{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SIM-DP</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <div class="fs-3 fw-bold text-success">SIM-DP</div>
                            <div class="text-muted small">Silakan login untuk melanjutkan</div>
                        </div>

                        {% if form.errors %}
                        <div class="alert alert-danger" role="alert">
                            Username atau password tidak valid.
                        </div>
                        {% endif %}

                        {% if next %}
                            {% if user.is_authenticated %}
                                <div class="alert alert-warning" role="alert">
                                    Anda tidak memiliki akses ke halaman tersebut.
                                </div>
                            {% endif %}
                        {% endif %}

                        <form method="post" novalidate>
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nama pengguna</label>
                                <input type="text" name="username" autofocus required class="form-control" placeholder="username">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Kata sandi</label>
                                <input type="password" name="password" required class="form-control" placeholder="********">
                            </div>
                            <button type="submit" class="btn btn-success w-100">Masuk</button>
                            <input type="hidden" name="next" value="{{ next }}">
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    ></script>
</body>
</html>
