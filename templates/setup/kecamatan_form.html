{% extends 'base.html' %}
{% block title %}Edit Kecamatan{% endblock %}

{% block page_title %}Edit Kecamatan{% endblock %}
{% block content %}
<div class="card shadow-sm border-0">
  <div class="card-header bg-white">
    <h6 class="mb-0 fw-bold">Edit Kecamatan</h6>
  </div>
  <div class="card-body">
    <form method="post" class="row g-3">
      {% csrf_token %}
      <div class="col-12">
        <label class="form-label">Nama Kecamatan</label>
        {{ form.name }}
      </div>
      <div class="col-md-6">
        <label class="form-label">Kode (opsional)</label>
        {{ form.code }}
      </div>
      <div class="col-md-6">
        <label class="form-label">Kabupaten</label>
        {{ form.kabupaten }}
      </div>
      <div class="col-12 d-flex justify-content-end gap-2">
        <a href="{% url 'setup_kecamatan' %}" class="btn btn-light border">Batal</a>
        <button type="submit" class="btn btn-success px-4">Simpan</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
