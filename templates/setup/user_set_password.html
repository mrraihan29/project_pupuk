{% extends 'base.html' %}
{% block page_title %}Set Password{% endblock %}
{% block content %}
<div class="card shadow-sm border-0">
  <div class="card-header bg-white d-flex justify-content-between align-items-center">
    <div>
      <h6 class="mb-0 fw-bold">Set Password</h6>
      <small class="text-muted">User: {{ target_user.username }}</small>
    </div>
  </div>
  <div class="card-body">
    <form method="post" class="row g-3">
      {% csrf_token %}
      {% for field in form %}
      <div class="col-md-6">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}
      </div>
      {% endfor %}
      <div class="col-12 d-flex justify-content-end gap-2">
        <a href="{% url 'setup_users' %}" class="btn btn-light border">Batal</a>
        <button type="submit" class="btn btn-success px-4">Simpan</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
